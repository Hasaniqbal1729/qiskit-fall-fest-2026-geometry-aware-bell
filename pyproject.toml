[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-aware-bell-benchmark"
version = "0.1.0"
description = "Reproducible Qiskit Bell-state benchmark across processor geometries"
requires-python = ">=3.10"
dependencies = ["qiskit>=1.2,<3", "qiskit-aer>=0.15", "PyYAML>=6", "matplotlib>=3.8", "networkx>=3"]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.30"]

[project.scripts]
bellbench = "bellbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
